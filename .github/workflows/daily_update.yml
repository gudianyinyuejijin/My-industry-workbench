# GitHub Actions：每日构建并部署 行业主升浪工作台 到 GitHub Pages
#
# 触发：
#   - schedule: 工作日 (Mon-Fri) 北京时间 11:35 / 15:16 / 21:00 / 23:30
#       北京 = UTC+8 → 11:35 北京 = 03:35 UTC，15:16 北京 = 07:16 UTC
#       两条 cron 分开写，保证分钟数各自精确（不能合并成 35 3,7——那会让下午变成 15:35）
#
#       设计意图：A股 15:00 收盘，东财当场就有当天收盘价，所以把首刷放在
#       15:06（收盘后 6 分钟），而不是等到 17:00 —— 17:00 是当初被申万
#       隔夜发布拖出来的妥协，换成东财实时源之后就没必要了。
#       15:16 / 15:28 是给 GitHub cron 不确定延迟兜底的（谁先跑起来谁生效）。
#   - workflow_dispatch: 手动触发（首次部署 / 应急刷新）
#
# 数据源（2026-09-16 起三级降级，见 updater.fetch_all）：
#   1) 东财全量 K 线 push2his     —— 实时、口径统一，首选
#   2) 申万历史 + 东财当日涨跌幅补齐 push2delay —— push2his 不可达时的主力方案，
#      实测申万 155 个行业与东财板块匹配率 100%，能把当天收盘补上
#   3) 申万源单跑                 —— 最差也能到 T-1
#   21:00 / 23:30 两次补跑是保险：数据日期没变化时不会重复推送。
#
# 并发：concurrency=cancel-in-progress 防止两次叠跑。
#
# 关键设计：
#   1) 每次运行 generate.py 后，把刷新的小文件（index.html / workbench.json）
#      commit 回仓库 —— 既是历史快照，更重要的是让仓库保持活跃，
#      避免GitHub「60天无提交自动停用定时任务」的机制把每日更新悄悄停掉。
#      （大文件 sw_industry.pkl 不回传，防止仓库膨胀；反正每次都会重抓最新。）
#   2) 部署用 GitHub Pages with Actions（upload-pages-artifact + deploy-pages 标准4步）。

name: daily_workbench

on:
  schedule:
    # 申万行业指数数据发布常滞后于收盘数小时（2026-09-14 18:00 时其最新仍为 09-11），
    # 所以夜里加两次"补跑"，确保当天数据一旦发布就能抓到并推送。
    - cron: '35 3 * * 1-5'    # 北京时间 工作日 11:35（=UTC 03:35）上午快照
    - cron: '16 7 * * 1-5'     # 北京时间 工作日 15:16（=UTC 07:16）收盘后（主力）
    - cron: '00 13 * * 1-5'   # 北京时间 工作日 21:00（=UTC 13:00）补跑
    - cron: '30 15 * * 1-5'   # 北京时间 工作日 23:30（=UTC 15:30）末次补跑
                              # 注1：避开整点——GitHub整点是全球定时高峰，
                              #      cron 常被延迟甚至丢弃（2026-09-11 的 17:00 就被丢过）
                              # 注2：补跑全部错开分钟，且只在数据日期变化时才推送
                              # 注3：是否推微信由 push_report.py 比对「数据指纹」决定，
                              #      数据没实质变化就不推，所以一天不会收到重复内容。
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: true

permissions:
  contents: write   # 需要 write 才能 commit 回仓库（保持仓库活跃）
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30        # 东财全量重建（约 3-6 分钟）+ 申万兜底重抓（约 6 分钟）留足余量
    steps:
      - name: checkout (含 data/ 14MB pkl)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 保留 history，保证 commit/push 正常
          lfs: false            # sw_industry.pkl 已是普通 git 跟踪，无需 LFS

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: generate static index.html
        run: python generate.py


      # 是否推送由 push_report.py 自己判断：
      # 它会拿 git HEAD 里上次那份 workbench.json 跟本次比对「数据指纹」
      # （交易日 + TOP20 的行业名次和整数分数），有实质变化才推。
      # 这样做是因为：中午那次经常「日期没变、但数据已被修正」——
      # 昨天下午是『申万T-2 + 东财推算』，今天中午申万发出真实 T-1，
      # 分数会变而 trade_date 不变，只比日期就会漏推。
      # 若想让某一档无条件推，给它加 env: FORCE_PUSH: '1' 即可。
      # 申万数据源发布滞后（常晚于收盘数小时），所以一天跑多次"补跑"。
      # 只有数据日期真的变化时才推送，避免同一天收到多条重复战报。
      - name: 检查数据日期是否变化
        id: check
        run: |
          OLD=$(git show HEAD:data/workbench.json 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('trade_date',''))" 2>/dev/null || echo "")
          NEW=$(python3 -c "import json;print(json.load(open('data/workbench.json')).get('trade_date',''))")
          echo "上次数据日期=$OLD  本次数据日期=$NEW"
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "数据已更新，本次将推送战报"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据日期未变化，跳过推送（避免重复扰民）"
          fi

      - name: 推送每日战报到微信/手机
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true        # 推送失败不阻断网页部署
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_KEY:       ${{ secrets.BARK_KEY }}
          EMAIL_HOST:     ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT:     ${{ secrets.EMAIL_PORT }}
          EMAIL_USER:     ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:     ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
        run: python push_report.py

      - name: commit refreshed data back (防止60天无提交被停用定时)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/workbench.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(daily): refresh workbench $(date -u +%F_%H%M)"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push || echo "push failed (non-critical, deployment continues)"
          fi

      - name: setup Pages
        uses: actions/configure-pages@v5

      - name: upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Pages 站点根目录；仓库根有 index.html，直接作为入口
          path: .

      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: summary
        if: always()
        run: |
          echo "✅ Pages deployed (run ${{ github.run_number }})"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
